    <link rel="manifest" href="/manifest.json" />

    <!-- LCP image: FIRST in head for earliest discovery -->
    <link rel="preload" as="image" href="/foto-perfil.jpg" fetchpriority="high" />

    <!-- Critical CSS: inline hero styles to avoid FOUC and render-blocking -->
    <style>
      html,body{margin:0;padding:0;background:#fff;color:#111;font-family:system-ui,-apple-system,sans-serif}
      .dark html,.dark body{background:#0a0a0a;color:#f3f4f6}
      #root{min-height:100vh}
      .hero-grid{position:absolute;inset:0;opacity:0.03;background-image:linear-gradient(rgba(0,0,0,1) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,1) 1px,transparent 1px);background-size:60px 60px}
      .dark .hero-grid{opacity:0.05}
    </style>

    <!-- Fonts: non-render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
